import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.140' apply false
}

tasks.register('verifyEmiMixinParity') {
    description = 'Verify Fabric and Forge EMI mixins remain byte-identical'
    group = 'verification'
    def names = ['MixinEmiScreenManager.java', 'MixinEmiScreenSpace.java']
    def fabricDir = file('fabric/src/main/java/com/starskyxiii/collapsible_groups/mixin')
    def forgeDir = file('forge/src/main/java/com/starskyxiii/collapsible_groups/mixin')
    inputs.files(names.collectMany { [new File(fabricDir, it), new File(forgeDir, it)] })
    doLast {
        names.each { name ->
            byte[] fabricBytes = new File(fabricDir, name).bytes
            byte[] forgeBytes = new File(forgeDir, name).bytes
            if (!java.util.Arrays.equals(fabricBytes, forgeBytes)) {
                throw new GradleException("EMI mixin parity failed for ${name}")
            }
        }
    }
}

tasks.register('verifyJava17Artifacts') {
    description = 'Verify packaged Java and Minecraft 1.20.1 metadata'
    group = 'verification'
    dependsOn ':common:jar', ':fabric:remapJar', ':forge:reobfJar'
    doLast {
        def artifacts = [
            common: [task: 'jar', mixins: ['collapsible_groups.mixins.json']],
            fabric: [task: 'remapJar', mixins: ['collapsible_groups.mixins.json', 'collapsible_groups.fabric.mixins.json']],
            forge: [task: 'reobfJar', mixins: ['collapsible_groups.mixins.json', 'collapsible_groups.forge.mixins.json']]
        ]
        List<String> failures = []
        artifacts.each { projectName, artifact ->
            def artifactProject = project(":${projectName}")
            File jarFile = artifactProject.tasks.named(artifact.task).get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory && entry.name.endsWith('.class')) {
                        byte[] bytes = zip.getInputStream(entry).bytes
                        int minor = ((bytes[4] & 0xFF) << 8) | (bytes[5] & 0xFF)
                        int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
                        if (major != 61 || minor != 0) {
                            failures.add("${projectName}:${entry.name} -> class ${major}.${minor}")
                        }
                    }
                }
                artifact.mixins.each { path ->
                    def entry = zip.getEntry(path)
                    if (entry == null) {
                        failures.add("${projectName}:${path} -> missing")
                    } else {
                        def json = new JsonSlurper().parse(zip.getInputStream(entry))
                        if (json.compatibilityLevel != 'JAVA_17') {
                            failures.add("${projectName}:${path} -> ${json.compatibilityLevel}")
                        }
                    }
                }
                def packEntry = zip.getEntry('pack.mcmeta')
                if (packEntry == null) {
                    failures.add("${projectName}:pack.mcmeta -> missing")
                } else {
                    def packMetadata = new JsonSlurper().parse(zip.getInputStream(packEntry))
                    if (packMetadata.pack?.pack_format != 15) {
                        failures.add("${projectName}:pack.mcmeta -> ${packMetadata.pack?.pack_format}")
                    }
                }
                if (projectName == 'forge') {
                    def modsEntry = zip.getEntry('META-INF/mods.toml')
                    if (modsEntry == null) {
                        failures.add('forge:META-INF/mods.toml -> missing')
                    } else {
                        String modsMetadata = zip.getInputStream(modsEntry).getText('UTF-8')
                        String marker = "[[dependencies.${mod_id}]]"
                        def dependencyBlocks = modsMetadata.split(java.util.regex.Pattern.quote(marker)).drop(1)
                        [jei: '(,0],[0,)'].each { dependencyId, expectedRange ->
                            String block = dependencyBlocks.find { candidate ->
                                candidate.readLines().any { it.trim() == "modId = \"${dependencyId}\"" }
                            }
                            if (block == null) {
                                failures.add("forge:META-INF/mods.toml -> missing ${dependencyId} dependency")
                            } else {
                                def lines = block.readLines().collect { it.trim() }
                                String expectedRangeLine = "versionRange = \"${expectedRange}\""
                                if (!lines.contains('mandatory = false')) {
                                    failures.add("forge:META-INF/mods.toml -> ${dependencyId} is not optional")
                                }
                                if (!lines.contains('side = "CLIENT"')) {
                                    failures.add("forge:META-INF/mods.toml -> ${dependencyId} is not client-side")
                                }
                                if (!lines.contains(expectedRangeLine)) {
                                    failures.add("forge:META-INF/mods.toml -> ${dependencyId} range is not valid and unbounded")
                                }
                            }
                        }
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Version artifact guard failed:\n' + failures.sort().join('\n'))
        }
    }
}

def emiOnlyGuardPrefixes = [
    'com/starskyxiii/collapsible_groups/group/',
    'com/starskyxiii/collapsible_groups/viewer/',
    'com/starskyxiii/collapsible_groups/client/',
    'com/starskyxiii/collapsible_groups/compat/emi/',
    'com/starskyxiii/collapsible_groups/compat/kubejs/'
]
def emiOnlyGuardClasses = [
    'com/starskyxiii/collapsible_groups/CollapsibleGroups',
    'com/starskyxiii/collapsible_groups/compat/jei/manager/GroupManagerCard',
    'com/starskyxiii/collapsible_groups/compat/jei/manager/GroupManagerCardAssembler',
    'com/starskyxiii/collapsible_groups/compat/jei/manager/GroupManagerScreen',
    'com/starskyxiii/collapsible_groups/compat/jei/manager/PublishedGenerationRefresh',
    'com/starskyxiii/collapsible_groups/compat/jei/manager/UnavailableViewerGroupIndex',
    'com/starskyxiii/collapsible_groups/compat/jei/ui/GroupBackgroundRenderer',
    'com/starskyxiii/collapsible_groups/compat/jei/ui/GroupBorderRenderer',
    'com/starskyxiii/collapsible_groups/compat/jei/ui/GroupThemeResolver'
]
def emiOnlyForbiddenSymbols = [
    'mezz/jei/',
    'com/starskyxiii/collapsible_groups/compat/jei/JeiViewerAdapter',
    'com/starskyxiii/collapsible_groups/compat/jei/JeiViewerGroupIndex',
    'com/starskyxiii/collapsible_groups/compat/jei/editor/JeiEditorRuntimeAccess',
    'com/starskyxiii/collapsible_groups/compat/jei/runtime/GroupRegistry',
    'com/starskyxiii/collapsible_groups/compat/jei/data/GenericIngredientRef',
    'com/starskyxiii/collapsible_groups/compat/jei/preview/PreviewIngredientRenderer'
]
def emiOnlyKubeJsForbiddenSymbols = [
    'com/starskyxiii/collapsible_groups/compat/jei/'
]
def shouldGuardEmiOnlyClass = { String path ->
    path.endsWith('.class') && (emiOnlyGuardPrefixes.any { path.startsWith(it) }
        || emiOnlyGuardClasses.any { path == it + '.class' || path.startsWith(it + '$') })
}
def verifyEmiOnlyBytes = { String path, byte[] bytes, List<String> failures ->
    if (!shouldGuardEmiOnlyClass(path)) return
    String constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
    emiOnlyForbiddenSymbols.each { symbol ->
        if (constants.contains(symbol)) failures.add("${path} -> ${symbol}")
    }
    if (path.startsWith('com/starskyxiii/collapsible_groups/compat/kubejs/')) {
        emiOnlyKubeJsForbiddenSymbols.each { symbol ->
            if (constants.contains(symbol)) failures.add("${path} -> ${symbol}")
        }
    }
}

tasks.register('verifyEmiOnlyLinkage') {
    description = 'Reject JEI linkage from viewer-neutral and pure-EMI classes in compiled output and both loader jars'
    group = 'verification'
    dependsOn ':common:classes', ':fabric:jar', ':forge:jar'
    doLast {
        List<String> failures = []
        File classesDir = project(':common').layout.buildDirectory.dir('classes/java/main').get().asFile
        fileTree(classesDir).matching { include '**/*.class' }.files.each { file ->
            String path = classesDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            verifyEmiOnlyBytes(path, file.bytes, failures)
        }
        [project(':fabric'), project(':forge')].each { loaderProject ->
            File jarFile = loaderProject.tasks.named('jar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.directory && shouldGuardEmiOnlyClass(entry.name)) {
                        verifyEmiOnlyBytes(entry.name, zip.getInputStream(entry).bytes, failures)
                    }
                }
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException('Pure-EMI linkage guard found JEI references:\n' + failures.sort().join('\n'))
        }
    }
}

def groupLangSourceTrees = [
    fileTree('common/src/main/java') { include '**/defaults/**/*.java' },
    fileTree('fabric/src/main/java') { include '**/defaults/**/*.java' },
    fileTree('forge/src/main/java') { include '**/defaults/**/*.java' },
]

def groupLangOutputFile = file(
    'common/src/main/resources/assets/collapsible_groups/group_lang/en_us.json'
)

tasks.register('generateGroupLang') {
    description = 'Generate built-in group lang entries from default group provider sources'
    group = 'datagen'

    inputs.files(groupLangSourceTrees)
    outputs.file(groupLangOutputFile)

    doLast {
        def addEntry = { Map<String, String> map, String groupId, String fallbackName, File sourceFile ->
            def translationKey = "collapsible_groups.group.${groupId}"
            def previous = map.putIfAbsent(translationKey, fallbackName)
            if (previous != null && previous != fallbackName) {
                throw new GradleException(
                    "Conflicting fallback names for ${translationKey}: '${previous}' vs '${fallbackName}' in ${sourceFile}"
                )
            }
        }
        def titleCase = { String snakeCase ->
            snakeCase
                .split('_')
                .collect { word -> word.isEmpty() ? word : Character.toString(Character.toUpperCase(word.charAt(0))) + word.substring(1) }
                .join(' ')
        }

        def sourceFiles = groupLangSourceTrees
            .collectMany { it.files }
            .findAll { it.name.endsWith('.java') }
            .sort { a, b -> a.absolutePath.replace('\\', '/') <=> b.absolutePath.replace('\\', '/') }

        // Matches any method call whose first string literal argument starts with "__default_".
        // Convention: every method inside a DefaultGroupProvider that wraps group()
        // MUST pass groupId (which always starts with "__default_") as the first string
        // literal and fallbackName as the second string literal.
        // Using the "__default_" prefix as a discriminator avoids false matches on nested
        // helper calls (e.g. component(), item()) whose first argument is a registry key.
        def pattern = ~/\w+\(\s*"(__default_[^"]+)"\s*,\s*"([^"]+)"/
        def moduleSpecPattern = ~/(?s)private\s+static\s+final\s+ModuleSpec\s+(\w+)\s*=\s*new\s+ModuleSpec\(\s*"([^"]+)"\s*,\s*"(__default_[^"]+)"\s*,\s*"([^"]+)"\s*,\s*new String\[\]\s*\{(.*?)\}\s*\);/
        def moduleSpecTagPattern = ~/"([^"]+)"/
        def displayNameOverridePattern = ~/case\s+"([^"]+)"\s*->\s*"([^"]+)"/
        def pathGroupArrayPattern = ~/(?s)private\s+static\s+final\s+PathGroupSpec\[\]\s+(\w+)\s*=\s*\{(.*?)\};/
        def pathGroupEntryPattern = ~/new\s+PathGroupSpec\(\s*"([^"]+)"\s*,\s*"([^"]+)"/
        def pathGroupPrefixPattern = ~/(?s)for\s*\(\s*PathGroupSpec\s+(\w+)\s*:\s*(\w+)\s*\)\s*\{\s*groups\.add\(group\(\s*"(__default_[^"]+)"\s*\+\s*\1\.idSuffix\(\)\s*,\s*\1\.displayName\(\)/
        def entries = [:]

        sourceFiles.each { sourceFile ->
            def content = sourceFile.getText('UTF-8')
            def displayNameOverrides = [:]
            def displayNameOverrideMatcher = displayNameOverridePattern.matcher(content)
            while (displayNameOverrideMatcher.find()) {
                displayNameOverrides[displayNameOverrideMatcher.group(1)] = displayNameOverrideMatcher.group(2)
            }

            def matcher = pattern.matcher(content)
            while (matcher.find()) {
                addEntry(entries, matcher.group(1), matcher.group(2), sourceFile)
            }

            def moduleSpecMatcher = moduleSpecPattern.matcher(content)
            while (moduleSpecMatcher.find()) {
                def groupIdPrefix = moduleSpecMatcher.group(3)
                def displayPrefix = moduleSpecMatcher.group(4)
                def tagsBody = moduleSpecMatcher.group(5)
                def moduleSpecTagMatcher = moduleSpecTagPattern.matcher(tagsBody)
                while (moduleSpecTagMatcher.find()) {
                    def tag = moduleSpecTagMatcher.group(1)
                    def displayName = displayNameOverrides.getOrDefault(tag, titleCase(tag))
                    addEntry(entries, groupIdPrefix + tag, displayPrefix + displayName, sourceFile)
                }
            }

            def pathGroupPrefixes = [:]
            def parsedPathGroupEntries = [:].withDefault { 0 }
            def prefixMatcher = pathGroupPrefixPattern.matcher(content)
            while (prefixMatcher.find()) {
                def arrayName = prefixMatcher.group(2)
                def groupIdPrefix = prefixMatcher.group(3)
                pathGroupPrefixes[arrayName] = groupIdPrefix
            }

            def pathGroupArrayMatcher = pathGroupArrayPattern.matcher(content)
            while (pathGroupArrayMatcher.find()) {
                def arrayName = pathGroupArrayMatcher.group(1)
                def body = pathGroupArrayMatcher.group(2)
                def groupIdPrefix = pathGroupPrefixes[arrayName]
                if (groupIdPrefix == null) {
                    continue
                }

                def pathGroupEntryMatcher = pathGroupEntryPattern.matcher(body)
                while (pathGroupEntryMatcher.find()) {
                    def groupId = groupIdPrefix + pathGroupEntryMatcher.group(1)
                    def fallbackName = pathGroupEntryMatcher.group(2)
                    addEntry(entries, groupId, fallbackName, sourceFile)
                    parsedPathGroupEntries[arrayName] = parsedPathGroupEntries[arrayName] + 1
                }
            }

            pathGroupPrefixes.each { arrayName, groupIdPrefix ->
                if (parsedPathGroupEntries[arrayName] == 0) {
                    throw new GradleException(
                        "No PathGroupSpec entries were generated for ${arrayName} (${groupIdPrefix}*) in ${sourceFile}. " +
                        "Check generateGroupLang regex compatibility with the current source layout."
                    )
                }
            }

        }

        if (entries.isEmpty()) {
            throw new GradleException(
                'No built-in group entries found. Check the default provider source scan paths and group(...) call pattern.'
            )
        }

        def sortedEntries = new TreeMap<String, String>(entries)
        groupLangOutputFile.parentFile.mkdirs()
        groupLangOutputFile.setText(
            JsonOutput.prettyPrint(JsonOutput.toJson(sortedEntries)),
            'UTF-8'
        )

        logger.lifecycle(
            "Generated ${project.relativePath(groupLangOutputFile)} with ${sortedEntries.size()} entries"
        )
    }
}
