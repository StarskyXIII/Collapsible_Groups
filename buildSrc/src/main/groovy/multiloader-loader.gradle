plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(rootProject.tasks.named('generateGroupLang'))
    from(rootProject.layout.buildDirectory.dir('generated/group-language'))
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(rootProject.tasks.named('generateGroupLang'))
    from(rootProject.layout.buildDirectory.dir('generated/group-language'))
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        dependsOn(rootProject.tasks.named('generateBuiltinGroups'))
        from(layout.buildDirectory.dir('generated/builtin-groups'))
    }
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    exclude('assets/collapsible_groups/collapsible_groups/groups/**')
}

tasks.named('processResources') {
    includeEmptyDirs = false
}
