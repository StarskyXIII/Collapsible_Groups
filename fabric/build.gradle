plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    mavenLocal {
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev/'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}") { transitive = false }
    modCompileOnly "dev.emi:emi-fabric:${emi_version}"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
    // Mod Menu — optional; only needed for the config screen factory entrypoint
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    modCompileOnly("dev.latvian.mods:kubejs-fabric:${kubejs_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-fabric:${rhino_version}") { transitive = false }
    modCompileOnly("dev.architectury:architectury-fabric:${architectury_version}") { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.1'
}

sourceSets.main.java.srcDir rootProject.file('kubejs6/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('kubejs6/src/main/resources')
sourceSets.test.java.srcDir rootProject.file('kubejs6/src/test/java')

sourceSets.test {
    runtimeClasspath += sourceSets.main.compileClasspath.filter { file ->
        !file.name.toLowerCase(Locale.ROOT).startsWith('slf4j-api-')
    }
}

test {
    useJUnitPlatform()
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
