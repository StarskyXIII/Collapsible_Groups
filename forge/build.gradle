plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

repositories {
    mavenLocal {
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Architectury'
                url = 'https://maven.architectury.dev/'
            }
        }
        filter { includeGroup 'dev.architectury' }
    }
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
            ideName = "Forge Client (${project.path})"
        }
        server {
            server()
            ideName = "Forge Server (${project.path})"
        }
        data {
            data()
            ideName = "Forge Data (${project.path})"
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

jar {
    manifest {
        attributes['MixinConfigs'] = "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java.srcDir rootProject.file('kubejs6/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('kubejs6/src/main/resources')
sourceSets.test.java.srcDir rootProject.file('kubejs6/src/test/java')

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath.filter { file ->
        !file.name.toLowerCase(Locale.ROOT).startsWith('slf4j-api-')
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}") { transitive = false }
    modCompileOnly "dev.emi:emi-forge:${emi_version}"
    modRuntimeOnly "dev.emi:emi-forge:${emi_version}"

    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}") { transitive = false }
    modCompileOnly("dev.latvian.mods:rhino-forge:${rhino_version}") { transitive = false }
    modCompileOnly("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.1'
    testRuntimeOnly files(layout.buildDirectory.file("moddev/artifacts/client-extra-${minecraft_version}-${forge_version}.jar"))
}

test {
    dependsOn tasks.named('createMinecraftArtifacts')
    useJUnitPlatform()
}
