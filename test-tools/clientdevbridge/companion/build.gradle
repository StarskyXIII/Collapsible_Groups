plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.141' }
group = 'com.starskyxiii'
version = '0.1.0'
base.archivesName = 'cg-bridge-probe-26.1.2-neoforge'
neoForge { version = '26.1.2.99'; mods { cgbridgeprobe { sourceSet sourceSets.main } } }
