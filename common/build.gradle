plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
}

repositories {
    // The TerraformersMC maven truncates large transfers on some networks; a
    // pre-seeded local repository (see note/internal) takes priority for EMI.
    mavenLocal {
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // JEI common-api — loader-agnostic JEI interfaces, no NeoForge/Fabric specifics
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // JEI common — internal classes: IElement, IngredientElement, JeiTooltip, etc.
    compileOnly "mezz.jei:jei-${minecraft_version}-common:${jei_version}"
    // JEI packages mezz.jei.gui.* only in full loader jars. The referenced GUI
    // implementation FQCNs are shared, so one full jar supplies compile symbols only.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    // EMI's xplat Mojmap jar supplies the loader-neutral API and the two stable
    // screen internals targeted by our optional mixins. It is compile-only here;
    // loader modules provide their own runtime artifact.
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"

    // Tests — pure Java logic only (path grammar, path navigation)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.ow2.asm:asm:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
}

def jeiAbiArtifacts = []
['forge', 'fabric'].each { loader ->
    ['15.20.0.102', '15.59.0.211', '15.59.0.212', '15.62.0.214', '15.62.0.216'].each { version ->
        def artifact = configurations.create("jeiAbi_${loader}_${version.replace('.', '_')}") {
            canBeConsumed = false
            transitive = false
        }
        dependencies.add(artifact.name, "mezz.jei:jei-${minecraft_version}-${loader}:${version}")
        jeiAbiArtifacts.add(artifact)
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
    neutralCheck {
        java {
            srcDir 'src/main/java'
			srcDir 'src/test/java'
            include 'com/starskyxiii/collapsible_groups/group/**/*.java'
            include 'com/starskyxiii/collapsible_groups/ingredient/**/*.java'
			include 'com/starskyxiii/collapsible_groups/internal/version/data/**/*.java'
			include 'com/starskyxiii/collapsible_groups/internal/query/**/*.java'
			include 'com/starskyxiii/collapsible_groups/platform/fluid/**/*.java'
			include 'com/starskyxiii/collapsible_groups/platform/TestPlatformHelper.java'
            include 'com/starskyxiii/collapsible_groups/viewer/**/*.java'
            include 'com/starskyxiii/collapsible_groups/client/**/*.java'
        }
        compileClasspath = files(
            sourceSets.main.output,
			configurations.compileClasspath.filter { file ->
				!file.name.toLowerCase(Locale.ROOT).startsWith('jei-') &&
				!file.name.toLowerCase(Locale.ROOT).startsWith('emi-')
			},
			configurations.testCompileClasspath.filter { file ->
                !file.name.toLowerCase(Locale.ROOT).startsWith('jei-') &&
                !file.name.toLowerCase(Locale.ROOT).startsWith('emi-')
            }
        )
    }
}

tasks.named('compileNeutralCheckJava') {
    dependsOn tasks.named('classes')
    doFirst {
        def viewerEntries = classpath.files.findAll { file ->
            def name = file.name.toLowerCase(Locale.ROOT)
            name.startsWith('jei-') || name.startsWith('emi-')
        }
        if (!viewerEntries.isEmpty()) {
            throw new GradleException("Neutral compile classpath contains viewer artifacts: ${viewerEntries}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('compileNeutralCheckJava')
	dependsOn rootProject.tasks.named('verifyEmiMixinParity')
	dependsOn rootProject.tasks.named('verifyEmiOnlyLinkage')
	dependsOn rootProject.tasks.named('verifyJava17Artifacts')
}

test {
    dependsOn ':forge:reobfJar', ':fabric:remapJar'
    useJUnitPlatform()
    systemProperty 'collapsibleGroupsRoot', rootProject.projectDir.absolutePath
    inputs.files(jeiAbiArtifacts)
    inputs.files {
        ['forge': 'reobfJar', 'fabric': 'remapJar'].collect { loader, jarTask ->
            project(":${loader}").tasks.named(jarTask).get().archiveFile.get().asFile
        }
    }
    doFirst {
        systemProperty 'jeiAbiArtifacts', jeiAbiArtifacts.collect { it.singleFile.absolutePath }.join(File.pathSeparator)
        ['forge': 'reobfJar', 'fabric': 'remapJar'].each { loader, jarTask ->
            systemProperty "jeiAbi.${loader}.jar", project(":${loader}").tasks.named(jarTask).get().archiveFile.get().asFile.absolutePath
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.named('processResources') {
    dependsOn(rootProject.tasks.named('generateGroupLang'))
    from(rootProject.layout.buildDirectory.dir('generated/group-language'))
}

tasks.named('sourcesJar') {
    dependsOn(rootProject.tasks.named('generateGroupLang'))
    from(rootProject.layout.buildDirectory.dir('generated/group-language'))
}

['processResources', 'sourcesJar'].each { taskName ->
    tasks.named(taskName) {
        dependsOn(rootProject.tasks.named('generateBuiltinGroups'))
        from(layout.buildDirectory.dir('generated/builtin-groups'))
    }
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
    exclude('assets/collapsible_groups/collapsible_groups/groups/**')
}

tasks.named('processResources') {
    includeEmptyDirs = false
}
