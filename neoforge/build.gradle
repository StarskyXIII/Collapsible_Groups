plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    mavenLocal {
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
    }
    maven {
        name = 'KubeJSMirror'
        url = 'https://maven.latvian.dev/mirror'
        content { includeGroup 'com.github.rtyley' }
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
	unitTest {
		enable()
		testedMod = mods.getByName(mod_id)
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
	testRuntimeOnly "dev.latvian.mods:kubejs-neoforge:${providers.gradleProperty('kubejs_test_version').getOrElse(kubejs_version)}"
	if (providers.gradleProperty('rhino_test_version').isPresent()) {
		testRuntimeOnly("dev.latvian.mods:rhino:${providers.gradleProperty('rhino_test_version').get()}") {
			version { strictly(providers.gradleProperty('rhino_test_version').get()) }
		}
	}
}

sourceSets.test {
	compileClasspath += sourceSets.main.compileClasspath
	runtimeClasspath += sourceSets.main.compileClasspath.filter {
		!it.name.startsWith('kubejs-') && !it.name.startsWith('rhino-')
	}
}

test {
	useJUnitPlatform()
	systemProperty 'cg.test.kubejsVersion', providers.gradleProperty('kubejs_test_version').getOrElse(kubejs_version)
}
